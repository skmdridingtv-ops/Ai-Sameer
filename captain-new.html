<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071a45" />
<title>BlueCaptain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
:root{--y:#f4b41a;--yl:#fff0c8;--b:#1a5fd0;--bd:#0a2a66;--bl:#dce8ff;--ink:#0b1b3a;--mu:#5d6b85;--ln:#e3e9f5;--bg:#f3f6fc;--g:#12805c;--r:#d32f2f;--navy:#071a45}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",Arial,sans-serif;color:var(--ink);background:#fff;font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
#app{height:100dvh;max-width:480px;margin:0 auto;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden}
.top{background:linear-gradient(135deg,#071a45,#0d3b99);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));min-height:56px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:50%}
.badge{position:absolute;top:4px;right:2px;background:var(--r);color:#fff;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.pill{display:flex;align-items:center;gap:8px;border:1px solid #cfd3d9;border-radius:22px;padding:0 10px 0 14px;height:36px;font-size:13px;font-weight:500;color:#777;background:#fff}
.sw{width:30px;height:16px;border-radius:8px;background:#c9ccd1;position:relative;transition:.25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.25s}
.pill[aria-checked=true]{color:var(--g);border-color:var(--g)}
.pill[aria-checked=true] .sw{background:var(--g)}
.pill[aria-checked=true] .sw::after{left:16px}
.top .ib{color:#fff}.top .pill{background:rgba(255,255,255,.12);border-color:#f4b41a;color:#fff}.top .pill[aria-checked=true]{color:#7dffc4;border-color:#7dffc4}
#splash{position:fixed;inset:0;z-index:100;background:#071a45;display:flex;align-items:center;justify-content:center;transition:opacity .4s}#splash.hide{opacity:0;pointer-events:none}#splash img{width:min(70vw,280px);border-radius:28px}
.scroll{flex:1;overflow-y:auto;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.earnbar{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--bl);padding:12px 16px;font-weight:600;font-size:15px}
.earnbar span{display:flex;align-items:center;gap:6px}
.epanel{background:var(--bl);padding:4px 12px 14px;display:flex;gap:10px;overflow-x:auto}
.ecard{background:#fff;border-radius:10px;padding:12px 14px;min-width:150px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ecard small{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:12px}.ecard b{display:block;font-size:20px;margin-top:6px}
.rate{display:flex;justify-content:center;gap:6px;align-items:center;color:var(--b);font-weight:600;font-size:13px;background:var(--bl);width:100%;padding:0 0 12px}
.perf{margin:12px;border-radius:12px;background:linear-gradient(135deg,#071a45,#1a5fd0);color:#fff;padding:12px;position:relative}
.perf .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:12px;padding:3px 10px;font-size:12px}
.perf h3{font-size:16px;margin:6px 0 10px;font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:nowrap}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;color:var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.dot.x{background:transparent;color:#fff}
.medal{position:absolute;right:12px;top:-4px}
.greet{text-align:center;padding:30px 20px 10px}
.greet p{margin-top:16px;font-size:15px}
.mapc{position:relative;margin:12px;border:1px solid var(--ln);border-radius:22px;overflow:hidden;background:#f2f4f3}
.map{position:absolute;inset:0;width:100%;height:100%}#gmap{position:absolute;inset:0}
.mb{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#444;z-index:2}
.mchip{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:0 18px 0 8px;height:48px;font-weight:600;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2;color:#16181d}
.mchip[aria-pressed=true]{outline:2px solid var(--b)}
.mi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid;flex:none}
.mstat{position:absolute;top:12px;left:12px;background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2;color:#16181d;max-width:calc(100% - 84px)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--g);flex:none;animation:pls 1.4s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(18,128,92,.6)}100%{box-shadow:0 0 0 10px rgba(18,128,92,0)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.ring{animation:none}}
.fold{min-height:calc(100dvh - 100px)}
.stories{display:flex;gap:14px;padding:6px 14px 14px;overflow-x:auto}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mu);min-width:56px}
.story i{width:48px;height:48px;border-radius:50%;border:2px solid #7c8cf0;background:var(--bl);display:flex;align-items:center;justify-content:center;color:var(--b)}
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px;padding-bottom:calc(14px + env(safe-area-inset-bottom));align-items:center;pointer-events:none}
.dock>*{pointer-events:auto}
.fab{width:56px;height:56px;border-radius:50%;background:var(--yl);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);flex:none}
.navp{flex:1;height:56px;border-radius:30px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);display:flex;justify-content:space-around;align-items:center;padding:0 8px}
.navp button{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;color:#666;padding:4px 14px;border-radius:24px;min-height:44px;justify-content:center}
.navp button.on{color:#fff;background:var(--navy);flex-direction:row;gap:8px;font-size:13px;font-weight:600}
.home-on{background:#e3ecff;color:#0a2a66!important;flex-direction:row!important;gap:8px!important;font-size:13px!important;font-weight:600}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}.shade.show{display:block}
.speed{position:absolute;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;display:none;flex-direction:column;gap:12px}.speed.show{display:flex}
.speed button{display:flex;align-items:center;gap:10px;background:var(--yl);padding:10px 22px;border-radius:30px;font-weight:600;min-height:48px}
.speed button.bl{background:#fff}
.chips{display:flex;gap:8px;padding:8px 14px;overflow-x:auto}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);background:#fff;border-radius:22px;padding:0 14px;height:38px;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip.on{background:#fff;border-color:#bbb}
.drop{margin:4px 14px;border-radius:12px;padding:12px;font-size:14px}
.drop.s{background:#c9d4ea}.drop.g{background:#fbc7cc}
.drop .row2{background:#fff;border-radius:8px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.mid{text-align:center;padding:90px 24px;color:#222}.mid .pill{margin:14px auto 0;width:max-content}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));min-height:56px;border-bottom:1px solid var(--ln);background:#fff}
.bar h1{font-size:17px;font-weight:600;flex:1}
.help{display:flex;align-items:center;gap:6px;border:1.5px solid #111;border-radius:8px;height:36px;padding:0 10px;font-weight:600;font-size:14px}
.pad{padding:14px}
.tabs{display:flex;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;height:48px;color:var(--mu);font-weight:500;border-bottom:3px solid transparent}.tabs button.on{color:#1a3c7a;border-color:#1a3c7a;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.14);margin-bottom:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;min-height:52px}
.li small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.li .t{flex:1;font-weight:500}.grn{color:var(--g)!important}.org{color:#e67e22!important}
.menu{background:var(--bg);border-radius:10px;margin:0 12px 8px}
.menu .li{font-size:14px;font-weight:500}
.btn-o{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:10px 12px 0;border:1.5px solid #111;border-radius:24px;height:46px;font-weight:600;font-size:14px}
.btn-d{background:#7a1722;color:#fff;border-color:#7a1722}
.stats{display:flex;justify-content:center;gap:34px;text-align:center;padding:12px 0 16px;border-bottom:1px solid var(--ln);margin-bottom:12px}
.stats b{display:block;font-size:22px}.stats small{font-size:11px;color:var(--mu);letter-spacing:.5px}
.hero{height:130px;background:linear-gradient(180deg,#0d3b99,#071a45);border-radius:0 0 40px 40px}
.av{width:78px;height:78px;border-radius:50%;background:#e5e7eb;margin:-39px auto 8px;display:flex;align-items:center;justify-content:center;color:#888;border:3px solid #fff}
.name{text-align:center;font-weight:600;font-size:16px}
.seg{display:flex;gap:6px;padding:12px 14px}.seg button{flex:1;height:40px;border-radius:8px;background:#e8e9ec;font-weight:500}.seg button.on{background:var(--y);font-weight:700}
.big{display:flex;border:1px solid var(--ln);border-radius:10px;margin:8px 14px;padding:14px 0;text-align:center}
.big div{flex:1}.big b{font-size:26px;display:block}.big small{color:var(--mu);font-size:12px}
.sub2{display:flex;gap:8px;padding:6px 14px}.sub2 button{background:#e8e9ec;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600}.sub2 button.on{background:var(--yl)}
.ord{margin:10px 14px;border:1px solid var(--ln);border-radius:8px;padding:12px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ord .h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.ord p{display:flex;gap:8px;align-items:center;margin-top:6px;color:#444}.ord p::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}.ord p.d::before{background:var(--r)}
.field{padding:14px 18px;border-bottom:1px solid #cfd8e3;margin:0 8px}.field small{display:block;color:var(--mu);font-size:12px}.field div{font-size:17px;margin-top:6px}
.idc{margin:24px 16px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}
.idc .top1{background:var(--y);height:120px;position:relative}
.drawer{position:absolute;top:0;bottom:0;left:0;width:84%;background:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{background:linear-gradient(135deg,#071a45,#1a5fd0);color:#fff;padding:18px 14px;padding-top:calc(18px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.dh .av2{width:40px;height:40px;border-radius:50%;background:#fff;color:#777;display:flex;align-items:center;justify-content:center;flex:none}
.dh .avg{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid #fff;border-radius:18px;padding:5px 12px;font-size:13px;font-weight:600}
.dl{flex:1;overflow-y:auto;padding:6px 0}.dl .li{padding:12px 16px}.dl small{font-size:12px}
.lift{margin:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--b);color:#fff;border-radius:30px;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700}
.srch{position:absolute;left:24px;right:24px;top:40%;background:rgba(50,50,50,.92);color:#fff;border-radius:8px;padding:20px;text-align:center;z-index:70;display:none}.srch.show{display:block}.chip.stay{background:#a9d6ea;border-color:#a9d6ea}
.fbanner{background:#fff3cd;color:#664d03;font-size:12px;line-height:1.4;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;z-index:5}.fbanner button{font-weight:700;min-width:32px;min-height:32px;color:inherit}
.toast{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}.toast.show{opacity:1}
.refer{background:linear-gradient(135deg,#fff3d0,#ffd98a);height:170px;padding:16px;font-weight:700;font-size:20px;color:#0a2a66}
.yb{background:var(--y);width:calc(100% - 28px);margin:0 14px;height:50px;border-radius:26px;font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:50;border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));display:none}.sheet.show{display:block}
.sheet button.opt{display:block;width:100%;text-align:left;min-height:50px;padding:0 14px;border:1px solid var(--ln);border-radius:10px;margin-top:8px;font-size:16px}
.sheet .opt.on{border-color:var(--b);background:#eaf2ff;font-weight:600}
@media (prefers-reduced-motion:reduce){.sw,.sw::after,.drawer{transition:none}}
</style>

vehicle(){return `<div style="${AB}"><h1 style="font-size:22px">Choose your vehicle</h1><p style="opacity:.85;font-size:14px;margin:6px 0 18px;line-height:1.5">మీరు ఏ వాహనం నడుపుతారు?<br>Only this vehicle’s services will be shown in the app.</p><div role="radiogroup" aria-label="Vehicle" style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px">${VEH.map(v=>{const on=S.pick===v.id;return `<button role="radio" aria-checked="${on}" data-veh="${v.id}" style="background:${on?"#fff":"rgba(255,255,255,.1)"};color:${on?"#0a2a66":"#fff"};border:2px solid ${on?"#f4b41a":"rgba(255,255,255,.25)"};border-radius:16px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600">${I(v.ic,34)}${v.n}<small style="font-weight:400">${v.te}</small></button>`}).join("")}</div>${S.pick==="car"?`<p style="font-weight:600;margin:16px 0 8px;align-self:flex-start">Choose car type</p><div role="radiogroup" aria-label="Car type" style="width:100%;display:grid;gap:8px">${CARS.map(c=>{const on=S.carType===c.id;return `<button role="radio" aria-checked="${on}" data-ct="${c.id}" style="display:flex;align-items:center;gap:12px;text-align:left;border-radius:14px;padding:12px 14px;min-height:60px;border:2px solid ${on?"#f4b41a":"rgba(255,255,255,.25)"};background:${on?"#fff":"rgba(255,255,255,.1)"};color:${on?"#0a2a66":"#fff"}">${I("car",26)}<span style="flex:1"><b>${c.n}</b><small style="display:block;font-weight:400;opacity:.85">${c.d}</small></span></button>`}).join("")}</div>`:""}<p id="verr" role="alert" style="color:#ffb4b4;font-size:13px;min-height:22px;margin:10px 0"></p><button class="yb" style="width:100%;margin:0" data-act="startapp">Continue</button></div>`},
incent(){const sv=SERV().map(s=>s.n).join(","),it=S.itab,d=S.iday;
const row=(r,m)=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0"><span style="width:16px;height:16px;border-radius:50%;border:2px solid ${m?"var(--r)":"#555"};background:${m?"var(--r)":"#fff"};color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px">${m?"!":""}</span><div style="flex:1;font-size:13px;font-weight:600">${r[0]}<small style="display:block;color:var(--r);font-size:11px;margin-top:2px">${r[1]}</small></div><b style="font-size:13px">${r[2]}</b></div>`;
const slot=(time,amt,rows,m,bg)=>`<p style="text-align:center;margin:16px 0 10px;font-size:12px;font-weight:600">${time}</p><div class="card"><div style="background:${bg};padding:14px"><b style="font-size:22px">Earn up to ₹${amt}</b><p style="font-size:11px;margin-top:6px;line-height:1.5">with ${sv}</p></div><div style="padding:6px 14px">${rows.map(r=>row(r,m)).join("")}${m?`<div style="background:#fdecea;color:var(--r);font-size:13px;font-weight:600;padding:10px;border-radius:6px;margin:6px 0 10px;display:flex;gap:6px;align-items:center">${I("info",14)} You missed to complete this incentive</div>`:""}</div></div><p style="text-align:right;font-size:11px;color:var(--b);text-decoration:underline">Terms & Conditions</p>`;
const A=[["Complete 3 Rides and 3 km","3 more Rides and 3 Km left","₹24"],["Complete 6 Rides and 7 km","6 more Rides and 7 Km left","₹54"],["Complete 8 Rides and 10 km","8 more Rides and 10 Km left","₹60"]],B=[["Complete 3 Rides and 3 km","3 more Rides and 3 Km left","₹24"],["Complete 6 Rides and 7 km","6 more Rides and 7 Km left","₹60"],["Complete 8 Rides and 10 km","8 more Rides and 10 Km left","₹60"]];
const s1=slot("12:00 PM to 02:59 PM",138,A,false,"#fdeeb0"),s2=slot("07:00 PM to 11:59 PM",144,B,false,"#fdeeb0");
const daily=`<div style="display:flex;gap:8px;padding:12px 14px">${[[10,"Nov<br>10"],[11,"Today<br>11"],[12,"Nov<br>12"],[13,"Nov<br>13"]].map(c=>`<button data-iday="${c[0]}" aria-pressed="${d===c[0]}" style="flex:1;min-height:44px;border-radius:8px;font-size:11px;font-weight:600;background:${d===c[0]?"#1a3c7a":"#e8e9ec"};color:${d===c[0]?"#fff":"#333"}">${c[1]}</button>`).join("")}</div><div style="padding:0 14px">${d<11?s1:d===11?s1+s2:s2}</div>`;
const weekly=`<div style="display:flex;gap:8px;padding:12px 14px;overflow-x:auto">${["Oct 12-18","Oct 19-25","Oct-Nov 26-1","Nov 2-8","Nov 9-15"].map((w,i)=>`<span style="min-width:76px;text-align:center;padding:10px 4px;border-radius:8px;font-size:11px;font-weight:600;background:${i===4?"#1a3c7a":"#e8e9ec"};color:${i===4?"#fff":"#333"}">${w}</span>`).join("")}</div><div style="margin:0 14px;background:#e8e9ec;border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center"><div><b>Incentives are not<br>available for now</b><small style="display:block;color:var(--mu);margin-top:4px">Check after sometime</small></div><span style="font-size:36px">💵</span></div>`;
const bonus=`<div style="padding:14px"><div class="card"><div style="background:#fdeeb0;padding:14px;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:22px">Earn extra ₹200</b><p style="font-size:12px;margin-top:4px">with ${SERV().slice(0,2).map(x=>x.n.replace(" Delivery","")).join(", ")}</p></div><span style="font-size:34px">💵</span></div><div style="padding:6px 14px">${row(["Complete 12 Rides","by 15-11-2026 • 10 more rides left","₹100"],false)}${row(["Complete 20 Rides","by 15-11-2026 • 18 more rides left","₹100"],false)}</div></div><p style="font-weight:700;margin:18px 0 10px">Other ways to earn Bonus!</p><button class="card li" style="background:linear-gradient(90deg,#fff3d0,#ffd98a)" data-go="refer"><span class="t" style="font-size:13px">Refer & Earn<b style="display:block;font-size:20px;color:#0a2a66;margin-top:2px">Up to ₹500</b></span><span style="font-size:34px">💵</span></button></div>`;
return bar("Incentives")+`<div class="tabs">${["Daily","Weekly","Bonus"].map(t=>`<button class="${it===t?"on":""}" data-itab="${t}">${t}</button>`).join("")}</div><div class="scroll">${it==="Daily"?daily:it==="Weekly"?weekly:bonus}</div>`},
svcmgr(){const c=SERV().map(s=>`<div class="card li" style="margin:0 0 12px"><span style="font-size:34px">${s.e}</span><span class="t" style="font-weight:600">${s.n}<small style="color:var(--b);font-weight:500">Know more →</small></span><button class="pill" style="padding:0 6px;height:30px" role="switch" aria-checked="${svOn(s.n)}" data-svc="${s.n}" aria-label="${s.n}"><span class="sw"></span></button></div>`);
return bar("Service Manager")+`<div class="scroll pad" style="background:var(--bg)"><p style="font-weight:600;margin-bottom:10px">Other Services</p>${c.slice(0,2).join("")}<div style="background:linear-gradient(135deg,#d8ccff,#b9a8f5);border-radius:14px;padding:16px;margin-bottom:12px"><b style="font-size:22px;color:#2b1a6b;line-height:1.3">Track your ₹150<br>cashback</b></div>${c.slice(2).join("")}</div>`},
mtransfer(){const ms=S.methods,v=S.tamt!==undefined?S.tamt:S.wallet;return bar("Money transfer",false)+`<div class="scroll pad" style="background:var(--bg)"><div class="card" style="padding:18px;text-align:center"><label for="tamt" style="font-size:12px;color:var(--mu)">Amount to transfer (wallet balance ₹${S.wallet})</label><div style="display:flex;justify-content:center;align-items:center;gap:4px;color:var(--r);font-size:36px;font-weight:700;margin-top:6px">₹<input id="tamt" type="number" inputmode="numeric" min="1" value="${v}" style="width:150px;border:none;border-bottom:2px solid var(--ln);font:inherit;color:inherit;text-align:center;outline:none;background:transparent"></div><p style="color:var(--g);font-size:12px;font-weight:600;margin-top:10px">Unlimited transfers • every day, 7 days a week</p></div>
<div class="card li"><span class="t" style="font-weight:600">Automatic Money Transfer<small>Send wallet balance to your account every day</small></span><button class="pill" style="padding:0 6px;height:30px" role="switch" aria-checked="${S.auto}" data-act="auto" aria-label="Automatic money transfer"><span class="sw"></span></button></div>
<p style="font-weight:600;margin:14px 0 8px">Deposit to</p>${ms.length?ms.map((m,i)=>{const on=S.sel===i;return `<button class="card li" data-sel="${i}" role="radio" aria-checked="${on}"><span style="width:20px;height:20px;border-radius:50%;border:2px solid ${on?"var(--b)":"#999"};background:${on?"radial-gradient(var(--b) 45%,#fff 50%)":"#fff"};flex:none"></span><span class="t">${m.t==="upi"?"UPI Id":"Bank Account"}<small>${m.v}</small></span></button>`}).join(""):`<p style="color:var(--mu);font-size:13px;margin-bottom:8px">No payment method added yet.</p>`}
<p style="font-weight:600;margin:14px 0 8px">Add New Payment Method</p><div style="display:flex;gap:10px"><button class="card li" style="flex:1;justify-content:center;margin:0" data-pm="bank">${I("bank",18)}Bank</button><button class="card li" style="flex:1;justify-content:center;margin:0" data-pm="upi">${I("wallet",18)}UPI</button></div><p id="terr" role="alert" style="color:var(--r);font-size:13px;min-height:20px;margin-top:10px"></p><button class="yb" style="margin:0;width:100%" data-act="transfer">Transfer</button></div>`},
paymethod(){const b=S.ptab==="bank",f=(id,l,ph,t="text")=>`<label for="${id}" style="font-weight:600;font-size:14px;display:block;margin:14px 0 6px">${l}</label><input id="${id}" type="${t}" placeholder="${ph}" style="width:100%;height:48px;border:1px solid var(--ln);border-radius:8px;padding:0 12px;font-size:16px">`;
return bar("Payment Method",false)+`<div class="tabs">${[["bank","Bank Account"],["upi","UPI Id"]].map(t=>`<button class="${S.ptab===t[0]?"on":""}" data-ptab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="scroll pad">${b?`<p style="font-size:14px">Your earnings will be transferred to the account details you provide below:</p>${f("pn","Full Name (Same as bank account)","Enter your name")}${f("pa","Account Number","Enter account number","tel")}${f("pa2","Confirm Account Number","Re-enter account number","tel")}${f("pi","IFSC Code","e.g. SBIN0001234")}`:`<p style="font-size:14px">The amount will be transferred to the UPI linked bank account</p><div class="card" style="padding:14px;margin-top:12px"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:14px">Add UPI Account<span style="color:var(--b);font-size:13px">Find UPI ID?</span></div>${f("uid","Please enter your UPI ID","mobilenumber@upi")}<p style="font-size:12px;color:var(--mu);margin-top:8px">UPI ID example: name@bankname or mobilenumber@upi</p></div>`}<p id="perr" role="alert" style="color:var(--r);font-size:13px;min-height:20px;margin-top:10px"></p><button class="yb" style="margin:0;width:100%" data-act="confirmpm">Confirm</button></div>`},
orderdetail(){const o=ORD[S.od]||ORD[0]||Array(7).fill("—");return `<header class="bar"><button class="ib" data-act="back" aria-label="Back">${I("arrow")}</button><div style="flex:1"><b style="font-size:15px">Order Details</b><br><small style="color:var(--mu)">${o[1]} | ${o[0].replace(", 2026","")}</small></div><button class="help" data-act="help">${I("head",18)}Help</button></header><div class="scroll" style="background:var(--bg)"><div style="background:#fff;padding:14px;font-size:13px">Order ID : #<b>${o[5]}</b><p class="grn" style="margin-top:8px;font-weight:600">Completed</p></div><div style="background:#fff;margin:10px 0;padding:16px"><small style="font-weight:600">Your Earning</small><div style="font-size:40px;font-weight:700;margin:6px 0">${o[2]}</div><div style="font-weight:600;font-size:13px">${o[6]} min</div><button class="li" style="display:inline-flex;width:auto;border:1px solid var(--ln);border-radius:20px;min-height:40px;padding:0 14px;margin-top:14px;font-size:13px" data-go="rates">View Rate Card ${I("right",14)}</button></div><div style="background:#fff;padding:16px"><b>Pickup and Drop info</b><p style="margin-top:12px;font-size:13px;line-height:1.5"><b>● Pickup</b><br>${o[3]}</p><p style="margin-top:12px;font-size:13px;line-height:1.5"><b>▼ Drop</b><br>${o[4]}</p></div></div>`},
home(){return `<div class="top"><button class="ib" data-act="drawer" aria-label="Menu">${I("menu")}</button>${dutyPill()}<span style="display:flex"><button class="ib" data-go="areas" aria-label="Areas">${I("pin")}</button><button class="ib" data-go="notes" aria-label="Notifications">${I("bell")}</button></span></div>
<div class="scroll"><div class="fold"><button class="earnbar" data-act="earn" aria-expanded="${S.earnOpen}"><span>Today’s Earnings</span><span>₹0 ${I(S.earnOpen?"up":"down",20)}</span></button>
${S.earnOpen?`<div class="epanel"><div class="ecard"><small>${I("wallet",14)}BlueCaptain Wallet Balance</small><b>₹${S.wallet}</b></div><div class="ecard"><small>${I("cash",14)}Today’s Earnings</small><b>₹0</b></div></div>`:""}
<button class="rate" data-go="rates">${I("info",14)}View Rate Card</button>
${perfCard()}
${S.duty?mapCard():`<div class="greet"><img src="${LOGO}" alt="AI Sameer Delivery Captain" width="120" height="120" style="border-radius:26px;box-shadow:0 6px 18px rgba(7,26,69,.3)"><p><span>Start getting orders</span><br><b>Go ON-DUTY now</b></p></div>`}
</div><div class="stories">${[["Follow","user"],["Performance","logo"],["Intercity","pin"],["Plan Rides","clock"],["Rewards","gift"]].map(s=>`<button class="story" ${s[0]==="Performance"?'data-go="perf"':'data-act="soon"'}><i>${I(s[1],22)}</i>${s[0]}</button>`).join("")}</div></div>${nav("home")}`},
orders(){const chips=[["services","gear","Services"],["goto","pin","Go To"],["stay","pin","Stay In"]];if(S.stay)chips.unshift(chips.splice(2,1)[0]);
return `<header class="bar" style="border:none"><h1>0 Orders</h1></header>
<div class="chips">${chips.map(c=>`<button class="chip ${S.chip===c[0]?"on":""} ${c[0]==="stay"&&S.stay?"stay":""}" data-chip="${c[0]}">${I(c[1],16)}${c[2]}</button>`).join("")}</div>
${S.chip==="services"?`<div class="drop s">Switch on more services to get more orders.${SERV().map(x=>`<div class="row2"><span>${x.e} ${x.n}</span><button class="pill" role="switch" aria-checked="${svOn(x.n)}" data-svc="${x.n}" aria-label="${x.n}"><span class="sw"></span></button></div>`).join("")}</div>`:""}
${S.chip==="goto"?`<div class="drop g"><div class="row2"><span>Ibbaluru, Bellandur, Beng…</span><button class="pill" role="switch" aria-checked="${S.goto}" data-act="goto"><span class="sw"></span></button></div><button class="li" style="padding:8px 0;min-height:40px;font-weight:600;font-size:13px" data-act="soon">${I("plus",14)} Add Area</button></div>`:""}
${S.chip==="stay"?`<div class="drop" style="background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2)"><div style="background:linear-gradient(180deg,#bfe6f5,#e4f3fa);border-radius:12px;padding:16px;text-align:center"><div style="font-size:44px" aria-hidden="true">🗺️</div><b style="font-size:16px;display:block;margin-top:6px">Stay In Area</b><p style="font-size:13px;margin-top:4px">Get orders within 3km from your current location</p></div><div style="background:#f3f6fc;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${S.area}</b><button class="pill" role="switch" aria-checked="${S.stay}" data-act="stay" aria-label="Stay In area"><span class="sw"></span></button></div></div>`:""}
<div class="scroll"><div class="mid">${S.duty?"Looking for orders near you…":"Go On-Duty to receive orders."}${dutyPill()}</div></div>${nav("orders")}`},
perf(){return bar("My Performance",false)+`<div class="scroll pad"><div class="card"><div style="background:linear-gradient(135deg,#071a45,#1a5fd0);color:#fff;padding:12px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center">New Account!<span class="tag" style="font-size:13px;border:1px solid #fff;border-radius:16px;padding:4px 12px">Know more</span></div><div style="padding:12px;font-size:13px;color:#555"><b style="color:var(--b)">Regular Count of Orders</b><br><br>Note: Today’s ride performance will affect your tomorrow’s earnings.</div></div>
<div class="card" style="padding:14px"><b style="font-size:26px">-- ★</b><div style="color:var(--mu);font-size:12px;margin:2px 0 10px">Your Rating</div><div style="background:#eee;text-align:center;padding:6px;font-size:12px;border-radius:4px">Minimum 10 rated orders required</div><p style="margin:14px 0 6px;font-size:13px;font-weight:600">In Last 10 Accepted Orders</p><b style="font-size:34px;color:var(--b)">0</b><div style="font-weight:600;margin:4px 0 8px">Orders Cancelled ›</div><div style="background:#0a2a66;border-radius:8px;padding:10px">${dots()}</div></div></div>`},
profile(){return bar("My Profile")+`<div class="scroll"><div class="hero"></div><div class="av">${I("user",40)}</div><div class="name">${esc(nm())}</div><div style="text-align:center;color:var(--mu);font-size:13px;margin-top:2px">${vLabel()}</div>
<div class="stats"><div><b>-- ★</b><small>RATING ›</small></div><div><b>${USER.orders}</b><small>ORDERS</small></div><div><b>${USER.years}</b><small>YEARS</small></div></div>
<div class="menu">${li("logo","Performance","","perf")}${li("user","Profile Info","","pinfo")}${li("id","BlueCaptain ID Card","","idcard")}${li("doc",S.veh==="cycle"?"Documents (PAN, Aadhaar)":"Documents (RC, DL, PAN)","","docs")}${li("lang","Language Settings","","langs")}${li("info","Connection check","","diag")}</div>
<button class="btn-o" data-act="logout">${I("power",18)}Logout</button><button class="btn-o btn-d" data-act="delete">${I("trash",18)}Delete Account</button></div>`},
pinfo(){return bar("Profile Info",false)+`<div class="scroll"><div class="av" style="margin:20px auto;width:120px;height:120px">${I("user",56)}</div>${[["Name",nm()],["Registered Number",USER.phone],["Gender","—"],["Date of Birth","—"],["Languages I Speak","—"]].map(f=>`<div class="field"><small>${f[0]}</small><div>${f[1]}</div></div>`).join("")}</div>`},
idcard(){const ph=S.docs.photo;return `<header class="bar" style="background:var(--idc);color:#fff;border:none;--idc:#071a45"><button class="ib" data-act="back" aria-label="Back" style="color:#fff">${I("arrow")}</button><h1>Captain ID Card</h1></header><div class="scroll" style="background:#eef1f6;padding:16px"><div style="--idc:#071a45;--idt:#9cc9ff;background:var(--idc);border-radius:28px;padding:22px 16px 24px;text-align:center"><svg width="60" height="112" viewBox="0 0 60 112" aria-hidden="true" style="display:block;margin:0 auto -18px;position:relative;z-index:1"><rect x="12" y="0" width="36" height="52" rx="8" fill="#111"/><path d="M30 50v26a10 10 0 1 0 10 10" fill="none" stroke="#f4b41a" stroke-width="7" stroke-linecap="round"/></svg><div style="background:#fff;border-radius:26px;padding:22px 16px 26px"><span style="display:block;width:20px;height:20px;border-radius:50%;background:var(--idc);margin:0 auto 20px"></span><div style="width:104px;height:104px;border-radius:50%;border:4px solid var(--idc);margin:0 auto 18px;overflow:hidden;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#888">${ph&&ph.url&&!ph.pdf?`<img src="${ph.url}" alt="Profile photo" style="width:100%;height:100%;object-fit:cover">`:I("user",48)}</div><div style="font-size:22px;font-weight:800;letter-spacing:1px;color:var(--idc);text-transform:uppercase;word-break:break-word">${esc(nm())}</div><div style="font-size:18px;font-weight:700;color:#5b6475;margin:10px 0 18px">${idno()}</div><div style="display:inline-block;border:1px solid #e3e8ef;border-radius:20px;padding:14px"><div id="qr" role="img" aria-label="Captain QR code" style="width:150px;height:150px"></div></div><div style="margin:22px auto 0;display:inline-block;background:var(--idc);color:#fff;font-weight:700;padding:13px 22px;border-radius:30px;font-size:15px">AI Sameer Delivery Captain</div></div><p style="color:var(--idt);font-weight:600;margin:22px 0 4px;font-size:17px">Powered by AI Sameer</p></div></div>`},
docs(){return bar("Documents")+`<div class="scroll pad">${DOCS().map(d=>`<div class="card">${docRow(d)}</div>`).join("")}</div>`},
kyc(){return `<div style="${AB}"><h1 style="font-size:22px">Upload your documents</h1><p style="opacity:.85;font-size:14px;margin:6px 0 16px;line-height:1.5">We use these to verify your account. Photo or PDF, up to 5 MB each.</p><input id="kname" type="text" autocomplete="name" placeholder="Full name (as on ID)" aria-label="Full name" value="${esc(S.name||"")}" style="width:100%;height:50px;border:none;border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:12px"><div style="width:100%;background:#fff;border-radius:16px;overflow:hidden">${DOCS().map(d=>`<div style="border-bottom:1px solid var(--ln)">${docRow(d)}</div>`).join("")}</div><p id="kerr" role="alert" style="color:#ffb4b4;font-size:13px;min-height:22px;margin:10px 0"></p><button class="yb" style="width:100%;margin:0" data-act="kycsubmit">Submit and Continue</button><button style="color:#fff;margin-top:12px;min-height:44px;text-decoration:underline" data-act="kycskip">Skip for now</button></div>`},
langs(){return bar("Language Settings",false)+`<div class="pad"><div class="menu" style="margin:0 0 10px">${li("grid","App Language","Set the language for your app","lang_app")}${li("bell","Notification Language","Set the language for notifications","lang_notif")}</div></div>`},
refer(){return bar("Refer and Earn")+`<div class="scroll"><div class="refer">Refer a friend<br>Join as a Captain<br><span style="font-size:30px">Earn up to ₹500</span></div><div class="card li" style="margin:-24px 14px 0;position:relative"><span class="t">Your Referral Earnings<small style="font-size:16px;color:#111;font-weight:600">₹0</small></span>${I("right",16)}</div><div style="text-align:center;padding:50px 30px;font-size:13px"><b>New referral rewards are coming soon</b><p style="color:var(--mu);margin-top:8px">Keep referring your friends. We will notify you when the next rewards campaign starts.</p></div></div><div style="padding:10px 14px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu)"><div style="background:var(--bg);padding:8px 12px;border-radius:6px">Your referral code:<br><b style="color:#111">BCXXXX00</b></div><button data-act="copy" style="color:#111;font-weight:600;display:flex;gap:6px;align-items:center;min-height:44px">Copy ${I("copy",16)}</button></div><div style="padding:0 0 calc(14px + env(safe-area-inset-bottom))"><button class="yb" data-act="soon">Refer Friends</button></div>`},
earnings(){const a=S.etab==="all";return bar("Earnings")+`<div class="tabs">${[["all","All Earnings"],["wallet","Wallet"]].map(t=>`<button class="${S.etab===t[0]?"on":""}" data-etab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="scroll pad" style="background:var(--bg)">${a?`<div class="card"><div style="text-align:center;padding:14px 0 6px;font-size:13px">Today’s Earnings<br><b style="font-size:30px">₹0</b></div>${li("list","All Orders","Order History and Order Earnings","orderhist")}</div><div class="card">${li("rupee","View Rate Card","","rates")}</div>`
:`<div class="card" style="text-align:center;padding:16px"><small style="font-size:14px">Your Wallet Balance</small><b style="display:block;color:${S.wallet>0?"var(--g)":"var(--r)"};font-size:32px;margin:6px 0 12px">₹${S.wallet}</b><button class="btn-o" style="width:auto;display:inline-flex;margin:0;padding:0 20px" data-go="mtransfer">${I("bank",16)}Money transfer</button><p style="font-size:12px;color:var(--g);font-weight:600;margin-top:10px">Unlimited withdrawals • every day, 7 days a week</p></div><div style="margin:12px 0;border-radius:10px;background:linear-gradient(90deg,#fff3d0,#ffd98a);padding:18px;font-weight:700;font-size:18px;color:#0a2a66">Refer and Earn<br>Up to ₹500</div><div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px"><b>Transaction History</b><span style="color:var(--b);font-weight:600;font-size:13px">Filter</span></div>${S.tx.length?"":`<div class="mid" style="padding:30px 10px;font-size:14px;color:var(--mu)">No transactions yet</div>`}${S.tx.map(x=>`<div class="card li"><span class="t">${x.t}<small>${x.d}</small></span><span style="color:var(--mu)">- ₹${x.a}</span></div>`).join("")}`}</div>`},
orderhist(){const L=[],cnt=0,amt="0";let last="";
const rows=L.map(o=>{const k=ORD.indexOf(o),h=o[0]!==last?`<p style="padding:10px 14px 0;color:#1a3c7a;font-weight:700;font-size:13px">${o[0]}</p>`:"";last=o[0];return h+`<button class="ord" style="display:block;width:calc(100% - 28px);text-align:left;background:#fff" data-od="${k}"><div class="h"><span style="font-weight:500">◷ ${o[1]}</span><span class="grn">${o[2]} ●</span></div><p>${o[3]}</p><p class="d">${o[4]}</p></button>`}).join("");
return bar("All Orders")+`<div class="seg">${["Day","Week","Month"].map(t=>`<button class="${S.tab===t?"on":""}" data-tab="${t}">${t}</button>`).join("")}</div><div class="scroll"><div class="big"><div><b>${cnt}</b><small>Completed Orders</small></div><div style="border-left:1px dashed #ccc"><b class="grn">₹${amt}</b><small>Order Earnings</small></div></div><p style="padding:6px 14px;font-size:13px;font-weight:500">Order History</p><div class="sub2">${["Completed","Cancelled","Missed"].map(t=>`<button class="${S.sub===t?"on":""}" data-sub="${t}">${t}</button>`).join("")}</div>${S.sub==="Completed"&&rows?rows:`<div class="mid" style="padding:50px 24px;color:#555">You have not ${S.sub.toLowerCase()} any orders</div>`}</div>`},
rates(){return bar("Rate Card")+`<div class="pad"><div class="card">${[["Base fare","₹25"],["Per km","₹6"],["Waiting charge (per min)","₹1"],["Night bonus","₹10"]].map(r=>`<div class="li"><span class="t">${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div><p style="font-size:12px;color:var(--mu)">Sample rates. Replace with your real rate card.</p></div>`},
areas(){return bar("Areas")+`<div class="mid" style="padding-top:80px">${I("pin",44)}<p style="margin-top:10px">No hot areas right now.<br>Check back during peak hours.</p></div>`},
notes(){return bar("Notifications",false)+`<div class="pad"><div class="mid" style="padding:80px 24px;color:var(--mu)">${I("bell",44)}<p style="margin-top:10px">No notifications yet</p></div></div>`}
};

function render(){
  const v=cur();
  $("#app").innerHTML=V[v]()+`<div class="shade" id="shade"></div><aside class="drawer" id="drawer" aria-label="Menu"><div class="dh"><span class="av2">${I("user",22)}</span><div><b>My Profile</b><br><small>-- ★</small></div><button class="avg" data-go="perf" data-close>New ›</button></div><div class="dl">
${li("wallet","Earnings","Transfer Money to Bank, History","earnings")}${li("cash","Incentives and More","Know how you get paid","incent")}${li("gift","Rewards","Insurance and Discounts","soon")}${li("grid","Service Manager","Manage your services","svcmgr")}${li("head","Help","Get support, Accident Insurance","soon")}${li("people","Refer friends","Earn up to ₹500","refer")}</div><div style="margin:0 0 10px;background:#e8eefc;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px"><span style="font-size:26px">🚗</span><span>Add another vehicle and earn more<br><button class="pill" style="margin-top:6px;height:30px;color:#fff;background:var(--bd);border-color:var(--bd);padding:0 14px" data-act="soon">Tap to Earn</button></span></div><button class="lift" data-act="soon">${I(vIcon(),22)}Ride mode</button></aside>
<div class="speed" id="speed"><button class="bl" data-act="soon">${I(vIcon(),22)}Ride Mode</button><button data-act="soon">${I(vIcon(),22)}Hub</button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div><div class="srch" id="srch" role="status"><b>Searching for orders…</b><br><small>Please wait</small></div><div class="toast" id="toast" role="status"></div>`;
  tr($("#app"));
  if(S.duty&&cur()==="home")initGMap();
  if(cur()==="idcard")drawQR();
  try{if(S.veh)localStorage.setItem("bc-nav",JSON.stringify(S.stack))}catch(e){}
  if(window.top!==window.self&&!S.noFB){const b=document.createElement("div");b.className="fbanner";b.setAttribute("role","note");b.innerHTML='<span>ℹ Running inside a preview frame: camera, GPS and cloud may be blocked. Open the app in its own browser tab.</span><button data-act="hidefb" aria-label="Close">✕</button>';$("#app").prepend(b)}
}
function go(n){if(["home","orders"].includes(n)){S.stack=[n]}else if(n==="profile"){S.stack.push(n)}else S.stack.push(n);S.chip=null;render()}
function closeAll(){["#shade","#drawer","#speed","#sheet"].forEach(s=>$(s)&&$(s).classList.remove("show"))}
function setDuty(v){S.duty=v;if(!v){S.stay=false;S.dutyAt=0}v?startTracking():stopTracking();saveSess();render();toast(v?"You are on duty":"You are off duty")}
function sheet(h){const s=$("#sheet");s.innerHTML=h;tr(s);s.classList.add("show");$("#shade").classList.add("show")}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-chip],[data-tab],[data-sub],[data-etab],[data-amt],[data-svc],[data-itab],[data-iday],[data-ptab],[data-pm],[data-sel],[data-veh],[data-od],[data-lg],[data-doc],[data-ct],[data-up]");
  if(e.target.id==="shade"){closeAll();return}
  if(!t)return;
  const d=t.dataset;
  if(d.close!==undefined)closeAll();
  if(d.go){closeAll();if(d.go==="soon"){toast("Coming soon");return}if(d.go==="od0"){S.od=0;S.stack.push("orderdetail");render();return}if(["home","orders"].includes(d.go)){go(d.go)}else{S.stack.push(d.go);S.chip=null;render()}return}
  if(d.chip){S.chip=S.chip===d.chip?null:d.chip;render();return}
  if(d.amt!==undefined){$("#wamt").value=d.amt;return}
  if(d.svc){S.svcOn[d.svc]=!svOn(d.svc);render();return}
  if(d.itab){S.itab=d.itab;render();return}
  if(d.iday){S.iday=+d.iday;render();return}
  if(d.ptab){S.ptab=d.ptab;render();return}
  if(d.pm){keep();S.ptab=d.pm;S.stack.push("paymethod");render();return}
  if(d.sel!==undefined){keep();S.sel=+d.sel;render();return}
  if(d.veh){S.pick=d.veh;if(d.veh!=="car")S.carType=null;render();return}
  if(d.ct){S.carType=d.ct;render();return}
  if(d.doc){pickDoc(d.doc);return}
  if(d.up){const q=d.up.split(":");closeAll();fileInput(q[1],q[0]);return}
  if(d.lg){const p=d.lg.split(":");if(p[0]==="app")S.alang=p[1];else S.nlang=p[1];saveSess();render();return}
  if(d.od!==undefined){S.od=+d.od;S.stack.push("orderdetail");render();return}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.sub){S.sub=d.sub;render();return}
  if(d.etab){S.etab=d.etab;render();return}
  switch(d.act){
    case"back":if(S.stack.length>1){S.stack.pop();render()}break;
    case"drawer":$("#shade").classList.add("show");$("#drawer").classList.add("show");break;
    case"speed":$("#shade").classList.add("show");$("#speed").classList.add("show");break;
    case"earn":S.earnOpen=!S.earnOpen;render();break;
    case"duty":if(S.duty){sheet(`<h3>Go off duty?</h3><p style="color:var(--mu);margin:6px 0 4px">You will stop receiving new orders.</p><button class="opt" data-act="offyes">Go off duty</button><button class="opt" data-act="cancel">Stay on duty</button>`)}else{setDuty(true);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>{},()=>toast("Turn on location to receive orders nearby."),{timeout:8000})}break;
    case"withdraw":sheet(`<h3>Withdraw money</h3><p style="color:var(--mu);margin:6px 0 10px">Balance ₹${S.wallet} • No daily limit</p><input id="wamt" type="number" inputmode="numeric" min="1" step="1" placeholder="Enter amount" aria-label="Amount" style="width:100%;height:50px;border:1px solid var(--ln);border-radius:10px;padding:0 14px;font-size:18px"><div style="display:flex;gap:8px;margin-top:10px">${[100,500,S.wallet].map(v=>`<button class="opt" style="margin:0;text-align:center" data-amt="${v}">${v===S.wallet?"All":"₹"+v}</button>`).join("")}</div><p id="werr" style="color:var(--r);font-size:13px;min-height:20px;margin-top:8px"></p><button class="opt on" style="text-align:center" data-act="wconfirm">Withdraw to bank</button>`);break;
    case"wconfirm":{const v=Math.floor(Number($("#wamt").value));if(!v||v<1){$("#werr").textContent="Enter an amount of ₹1 or more.";break}if(v>S.wallet){$("#werr").textContent="You can withdraw up to ₹"+S.wallet+".";break}S.wallet-=v;const n=new Date();S.tx.unshift({t:"Withdrawal to bank",a:v,d:n.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" • "+n.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});closeAll();render();toast("₹"+v+" withdrawal requested");break}
    case"sendotp":{const p=$("#ph").value.replace(/\D/g,"");if(!/^[6-9]\d{9}$/.test(p)){$("#lerr").textContent="Enter a valid 10-digit mobile number.";break}S.phone=p;S.stack=["otp"];render();break}
    case"verify":{if($("#otp").value.replace(/\D/g,"").length!==4){$("#oerr").textContent="Enter the 4-digit OTP.";break}S.stack=["vehicle"];render();break}
    case"backlogin":S.stack=["login"];render();break;
    case"startapp":{if(!S.pick){$("#verr").textContent="Please choose your vehicle.";break}if(S.pick==="car"&&!S.carType){$("#verr").textContent="Please choose a car type.";break}S.veh=S.pick;saveSess();cloudSaveProfile();S.stack=["kyc"];render();break}
    case"dologout":stopTracking();S.duty=false;S.dutyAt=0;S.name="";S.veh=null;S.carType=null;S.docs={};idbClear();try{localStorage.removeItem("bc-nav")}catch(x){}saveSess();S.pick=null;S.duty=false;S.stack=["login"];render();break;
    case"auto":keep();S.auto=!S.auto;render();toast(S.auto?"Daily auto-transfer is on":"Auto-transfer is off");break;
    case"transfer":{const v=Math.floor(Number($("#tamt").value)),m=S.methods[S.sel],er=t=>{$("#terr").textContent=t};if(!m){er("Add a payment method first.");break}if(!v||v<1){er("Enter an amount of ₹1 or more.");break}if(v>S.wallet){er("You can transfer up to ₹"+S.wallet+".");break}S.wallet-=v;const n=new Date();S.tx.unshift({t:"Money Transfer to "+(m.t==="upi"?"UPI":"Bank"),a:v,d:n.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" • "+n.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});S.tamt=undefined;S.stack.pop();render();toast("₹"+v+" transfer requested");break}
    case"confirmpm":{const er=t=>{$("#perr").textContent=t};let m;if(S.ptab==="bank"){const n=$("#pn").value.trim(),a=$("#pa").value.trim(),a2=$("#pa2").value.trim(),f=$("#pi").value.trim().toUpperCase();if(n.length<3)return er("Enter the name as on your bank account.");if(!/^\d{9,18}$/.test(a))return er("Account number should be 9–18 digits.");if(a!==a2)return er("Account numbers do not match.");if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(f))return er("Enter a valid IFSC code.");m={t:"bank",v:"A/c ••••"+a.slice(-4)+" • "+f}}else{const u=$("#uid").value.trim();if(!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(u))return er("Enter a valid UPI ID, e.g. name@upi.");m={t:"upi",v:u}}S.methods.push(m);S.sel=S.methods.length-1;S.stack.pop();render();toast("Payment method added");break}
    case"stay":{if(S.stay){S.stay=false;setDuty(false);break}$("#srch").classList.add("show");setTimeout(()=>{S.stay=true;S.chip=null;S.duty=true;startTracking();saveSess();render();toast("You are on duty")},1600);break}
    case"mapsize":S.mapBig=!S.mapBig;render();break;
    case"mchips":S.mchips=!S.mchips;render();break;
    case"msurge":S.surge=!S.surge;render();toast(S.surge?"Surge zones shown":"Surge zones hidden");break;
    case"msuper":S.superA=!S.superA;render();toast(S.superA?"Top areas shown":"Top areas hidden");break;
    case"mgoto":S.stack=["orders"];S.chip="goto";render();break;
    case"mloc":if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(window.BCMAP)window.BCMAP.panTo({lat:p.coords.latitude,lng:p.coords.longitude});toast("Location updated")},()=>toast("Turn on location to receive orders nearby."),{timeout:8000});else toast("Location not available");break;
    case"sos":sheet(`<h3>Emergency help</h3><p style="color:var(--mu);margin:6px 0 4px">If you are in danger, call the emergency number now.</p><a href="tel:112" style="display:flex;min-height:50px;align-items:center;justify-content:center;border-radius:10px;background:var(--r);color:#fff;font-weight:700;text-decoration:none;margin-top:8px">Call 112</a><button class="opt" data-act="cancel">Close</button>`);break;
    case"kycsubmit":{{const n=$("#kname");if(n)S.name=n.value.trim()}if(!S.name||S.name.length<3){$("#kerr").textContent="Please enter your full name.";break}if(!DOCS().filter(d=>d.req).every(d=>S.docs[d.k])){$("#kerr").textContent="Please upload all required documents, or skip for now.";break}enterApp();break}
    case"kycskip":{const n=$("#kname");if(n&&n.value.trim())S.name=n.value.trim();enterApp();break}
    case"runchecks":toast("Running checks…");runChecks();break;
    case"hidefb":S.noFB=true;render();break;
    case"offyes":setDuty(false);break;
    case"cancel":closeAll();break;
    case"svc":S.svc=!S.svc;render();break;
    case"goto":S.goto=!S.goto;render();break;
    case"copy":try{navigator.clipboard.writeText("BCXXXX00");toast("Referral code copied")}catch(x){toast("Copy not available")}break;
    case"logout":sheet(`<h3>Logout?</h3><button class="opt" data-act="cancel">Cancel</button><button class="opt on" data-act="dologout">Logout</button>`);break;
    case"delete":sheet(`<h3>Delete account?</h3><p style="color:var(--mu);margin:6px 0">This is a demo. Nothing will be deleted.</p><button class="opt" data-act="cancel">OK</button>`);break;
    default:closeAll();toast(d.act==="help"?"Help is coming soon":"Coming soon");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
/* Profile opens from drawer header */
document.addEventListener("click",e=>{const h=e.target.closest(".dh b,.dh .av2");if(h){closeAll();S.stack.push("profile");render()}});
try{const nv=JSON.parse(localStorage.getItem("bc-nav")||"null");if(SESS.veh&&Array.isArray(nv)&&nv.length&&nv.every(v=>typeof V[v]==="function"&&["login","otp","vehicle"].indexOf(v)<0))S.stack=nv}catch(e){}
if(S.duty)startTracking();
cloudInit();
render();
idbAll().then(o=>{const ks=Object.keys(o);if(!ks.length)return;ks.forEach(k=>{const v=o[k];if(!v||!v.blob)return;S.docs[k]={name:v.name,pdf:v.pdf,blob:v.blob,url:URL.createObjectURL(v.blob),cloud:(SESS.docsOk||[]).includes(k)?"ok":""}});render();if(cloud.ready)syncDocs()});
$("#splashImg").src=LOGO;setTimeout(()=>$("#splash").classList.add("hide"),1500);setTimeout(()=>$("#splash").remove(),2000);
</script>
</body>
</html>
