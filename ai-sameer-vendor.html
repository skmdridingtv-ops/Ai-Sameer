:root{--bg:#0b1f26;--panel:#12303a;--line:#2a5560;--text:#eef4f4;--mute:#9db8bc;--gold:#d9b25a;--blue:#4aa8ff;--ok:#5fd39a;--warn:#f0a35e;--bad:#ef6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3f3;--panel:#fff;--line:#c9d9db;--text:#10272d;--mute:#4f6b70;--gold:#8a6a1c;--blue:#1f6fc4;--ok:#1d8a5a;--warn:#b86a17;--bad:#c23b3b}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45;padding-bottom:76px}
header{padding:16px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:22px;background:var(--panel)}
h1{font-size:19px;margin:0;color:var(--gold);letter-spacing:.3px}
header small{color:var(--mute)}
main{padding:16px;max-width:760px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;position:relative;min-height:4px}
.bars div i{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute);font-style:normal}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row h3{margin:0;font-size:15px}
.row p{margin:2px 0 0;color:var(--mute);font-size:13px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.New{color:var(--blue)}.Packed{color:var(--warn)}.Delivered{color:var(--ok)}.Cancelled{color:var(--bad)}
button,input,select{font:inherit;color:var(--text)}
button{background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
form{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.low{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:2px solid var(--gold);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:8px;font-size:13px;padding:8px 2px}
nav button[aria-current="page"]{color:var(--gold);background:var(--bg)}
h2{font-size:17px;margin:4px 0 12px}
#lg{margin-left:auto;width:auto;max-width:42%}
.th{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.gi{position:relative}
.gi img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.gi button{position:absolute;top:6px;right:6px;padding:4px 9px;background:var(--bg)}
.lb{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:24px}
.logo{overflow:hidden;padding:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

 }

  h+='<h2>'+t("merchant")+'</h2><form id="mf"><input name="n" value="'+esc(db.merchant.name)+'" aria-label="'+t("shop")+'" required><input name="ph" value="'+esc(db.merchant.phone)+'" aria-label="'+t("phone")+'"><select name="o" aria-label="Shop status"><option value="1"'+(db.merchant.open?" selected":"")+'>'+t("open")+'</option><option value="0"'+(db.merchant.open?"":" selected")+'>'+t("closed")+'</option></select><button>'+t("save")+'</button></form><h2>'+t("shopph")+'</h2><div class="gal">'+(db.shop||[]).map(function(s,i){return '<div class="gi"><img alt="" src="'+s+'"><button class="ghost" data-dsp="'+i+'" aria-label="'+t("del")+'">✕</button></div>'}).join("")+'</div><input type="file" id="sp" accept="image/*" multiple aria-label="'+t("addph")+'"><br><br><button class="ghost" id="rs">'+t("logout")+'</button>';
 }
 v.innerHTML=h;
 var names={dash:t("dash"),orders:t("orders"),products:t("products"),merchant:t("merchant")},n="";
 for(var k in names)n+='<button data-tab="'+k+'"'+(k==tab?' aria-current="page"':"")+'>'+names[k]+'</button>';
 document.getElementById("nav").innerHTML=n;
}
document.addEventListener("click",function(e){
 var t=e.target,d=t.dataset;
 if(d.tab){tab=d.tab;render();return}
 if(d.adv){var o=db.orders.find(function(x){return x.id==d.adv});o.status=flow[flow.indexOf(o.status)+1];save();render()}
 if(d.st){db.products.find(function(x){return x.id==d.st}).stock+=5;save();render()}
 if(d.del){db.products=db.products.filter(function(x){return x.id!=d.del});save();render()}
 if(d.dsp){db.shop.splice(+d.dsp,1);save();render()}
 if(t.id=="rs"){if(fbOn)auth.signOut();try{localStorage.removeItem(KEY+"_s")}catch(x){}phone="";db=null;pending=null;err="";tab="dash";render()}
});
document.addEventListener("submit",function(e){
 e.preventDefault();var f=e.target,v=f.elements;
 if(f.id=="lf"){var ph=v.ph.value.replace(/\D/g,"").slice(-10);if(ph.length!=10){err=t("badph");render();return}err="";if(fbWant){if(!fbOn){err=t("fbfail");render();return}
  try{if(!verifier)verifier=new firebase.auth.RecaptchaVerifier("rcv",{size:"invisible"})}catch(x){}
  auth.signInWithPhoneNumber("+91"+ph,verifier).then(function(c){confirmation=c;pending=ph;render()}).catch(function(){err=t("sendfail");try{verifier.clear()}catch(x){}verifier=null;render()});return}
  if(!API){pending=ph;enter();render();return}
  call("/send-otp",{phone:ph,channel:v.ch.value},function(r){if(r&&r.sent){pending=ph}else{err=t("sendfail")}render()});return}
 if(f.id=="of"){var cd=v.o.value.trim();
  if(fbWant){confirmation.confirm(cd).catch(function(){err=t("badotp");render()});return}if(!API){if(cd==otpCode)enter();else err=t("badotp");render();return}
  call("/verify-otp",{phone:pending,code:cd},function(r){if(r&&r.approved)enter();else err=t("badotp");render()});return}
 if(f.id=="ordf"){db.orders.push({id:100+db.orders.length+1,cust:v.c.value.trim(),items:v.i.value.trim(),total:+v.t.value,status:"New"})}
 if(f.id=="pf"){var pr={id:Date.now(),name:v.n.value.trim(),price:+v.p.value,stock:+v.s.value,img:""},fl=v.im.files[0];if(fl){shrink(fl,320,function(d){pr.img=d;db.products.push(pr);persist()});return}db.products.push(pr)}
 if(f.id=="mf"){db.merchant={name:v.n.value.trim(),phone:v.ph.value,open:v.o.value=="1"}}
 save();render();
});
document.addEventListener("change",function(e){if(e.target.id=="lg"){lang=e.target.value;try{localStorage.setItem(KEY+"_l",lang)}catch(x){}render()}});
document.addEventListener("change",function(e){if(e.target.id=="sp"){var fs=Array.prototype.slice.call(e.target.files),n=fs.length;db.shop=db.shop||[];fs.forEach(function(f){shrink(f,800,function(d){if(db.shop.length<8)db.shop.push(d);if(--n==0)persist()})})}});
function enter(){phone=pending;pending=null;err="";try{localStorage.setItem(KEY+"_s",phone);db=JSON.parse(localStorage.getItem(KEY+"_d"+phone))}catch(x){db=null}if(!db)db=blank(phone)}
function call(p,b,cb){fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}
/* Firebase sign-in (phone OTP) */
if(fbWant){phone="";db=null;try{firebase.initializeApp(FB);auth=firebase.auth();if(firebase.firestore)fdb=firebase.firestore();fbOn=true}catch(e){}}
if(fbOn)auth.onAuthStateChanged(function(u){if(u&&u.phoneNumber){phone=u.phoneNumber.replace("+91","");uid=u.uid;pending=null;err=""}else{phone="";uid=""}if(phone){pending=phone;enter();pending=null}else{db=null};render()});
/* fallback: some preview apps block form submission; run the form handler ourselves */
var subF=null;
function arm(f){subF=f;setTimeout(function(){var g=subF;subF=null;if(g&&g.checkValidity())g.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))},80)}
document.addEventListener("submit",function(){subF=null},true);
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(b&&b.form&&b.type=="submit")arm(b.form)});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.tagName=="INPUT"&&e.target.form)arm(e.target.form)});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
render();
</script>
</body>
</html>
