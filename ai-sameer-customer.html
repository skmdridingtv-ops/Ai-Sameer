<title>AI Sameer</title>
<style>
:root{--bg:#0a1a3a;--panel:#12285a;--line:#2b4a8f;--text:#eef3ff;--mute:#a9bbe0;--gold:#f2c14e;--bad:#ff8b8b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{padding:16px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;border:2px solid var(--gold);display:grid;place-items:center;font-size:24px;background:var(--panel)}
h1{font-size:19px;margin:0;color:var(--gold)}
small,.mute{color:var(--mute)}
main{padding:16px;max-width:560px;margin:auto}
h2{font-size:17px;margin:4px 0 12px}
form{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--text)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
button{background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6bb6ff;outline-offset:2px}
#lg{margin-left:auto;width:auto;max-width:42%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.tile{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:18px 8px;font-size:16px}
.big{width:100%;padding:14px;font-size:16px}
.low{color:var(--bad)}
.card{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.card img,.card .ph{width:84px;height:84px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-size:30px}
.card h3{margin:0 0 2px;font-size:15px}.card p{margin:0;font-size:13px;color:var(--mute)}.card a{color:var(--gold);font-size:13px}
iframe{width:100%;height:240px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.card{width:100%;text-align:left;color:var(--text);align-items:center;font-weight:400}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.nm{font-weight:700;font-size:16px}
.fare{margin-left:auto;font-size:20px;font-weight:700;color:var(--gold)}
.logo{overflow:hidden;padding:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
</style>

function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,k=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(k))}
function foodView(){
 var base=food.live?food.list:SEED[food.city],ql=food.q.toLowerCase();
 var L=base.filter(function(x){return !ql||x.n.toLowerCase().indexOf(ql)>-1});
 if(food.pos)L=L.map(function(x){x.d=dist(food.pos.lat,food.pos.lng,x.lat,x.lng);return x}).sort(function(a,b){return a.d-b.d});
 var near=food.pos?food.pos.lat+","+food.pos.lng:CITY[food.city].n;
 var h='<button class="ghost" id="fb">\u2190 '+t("back")+'</button><h2>\uD83C\uDF7D\uFE0F '+t("food")+'</h2>';
 h+='<div class="row2"><select id="fc" aria-label="City">'+Object.keys(CITY).map(function(k){return '<option value="'+k+'"'+(k==food.city?" selected":"")+'>'+CITY[k].n+'</option>'}).join("")+'</select><button id="fl">\uD83D\uDCCD '+t("live")+'</button></div>';
 h+='<input id="fq" placeholder="'+t("search")+'" aria-label="'+t("search")+'" value="'+esc(food.q)+'" style="margin-top:8px">';
 h+='<iframe title="Google Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q='+encodeURIComponent((food.q||"restaurants")+" near "+near)+'&z=14&output=embed"></iframe>';
 if(food.msg)h+='<p class="mute" role="status">'+food.msg+'</p>';
 L.forEach(function(x){h+='<div class="card">'+(x.ph?'<img alt="" src="'+x.ph+'">':'<div class="ph">\uD83C\uDF7D\uFE0F</div>')+'<div><h3>'+esc(x.n)+'</h3><p>\u2B50 '+(x.r||"-")+' \u00B7 '+esc(x.a||"")+(x.d!=null?' \u00B7 '+x.d.toFixed(1)+' km':'')+'</p><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.n)+'&query_place_id='+x.id+'" target="_blank" rel="noopener">'+t("map")+'</a></div></div>'});
 if(food.live&&food.tok)h+='<button id="fm">'+t("more")+'</button>';
 if(!PLACES_KEY)h+='<p class="mute">'+t("nokey")+'</p>';
 return h}
function loadPlaces(more){
 if(!PLACES_KEY)return;
 var b={textQuery:(food.q||"restaurants")+" in "+CITY[food.city].n,pageSize:20};
 if(food.pos)b.locationBias={circle:{center:{latitude:food.pos.lat,longitude:food.pos.lng},radius:5000}};
 if(more&&food.tok)b.pageToken=food.tok;
 fetch("https://places.googleapis.com/v1/places:searchText",{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":PLACES_KEY,"X-Goog-FieldMask":"places.id,places.displayName,places.formattedAddress,places.rating,places.location,places.photos,nextPageToken"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(d){
  var ps=(d.places||[]).map(function(p){return{n:p.displayName&&p.displayName.text||"",a:p.formattedAddress,r:p.rating,id:p.id,lat:p.location.latitude,lng:p.location.longitude,ph:p.photos&&p.photos[0]?"https://places.googleapis.com/v1/"+p.photos[0].name+"/media?maxHeightPx=300&key="+PLACES_KEY:""}});
  food.list=more?food.list.concat(ps):ps;food.tok=d.nextPageToken||"";food.live=true;render()}).catch(function(){render()})}
/* Sample fares in Rs: b = base fare, p = per km, m = minimum fare, mx = max km. Change these to your own rates. */
var VEH=[{k:"bike",i:"\uD83C\uDFCD\uFE0F",n:"Bike",b:20,p:7,m:30},{k:"ev",i:"\uD83D\uDEB2",n:"EV Cycle",b:15,p:5,m:25,mx:10},{k:"scooter",i:"\uD83D\uDEF5",n:"Scooter",b:20,p:8,m:35},{k:"auto",i:"\uD83D\uDEFA",n:"Auto",b:30,p:12,m:40},{k:"mini",i:"\uD83D\uDE97",n:"Car \u00B7 Mini",b:50,p:14,m:80},{k:"sedan",i:"\uD83D\uDE98",n:"Car \u00B7 Sedan",b:60,p:17,m:100},{k:"suv",i:"\uD83D\uDE99",n:"Car \u00B7 SUV",b:80,p:22,m:130}];
var GRP={bike:["bike","scooter"],car:["mini","sedan","suv"],auto:["auto"],ev:["ev"]}; /* which vehicles each home button shows */
var ride={grp:"car",city:"yem",id:"",st:"",cap:"",fare:0,sel:"mini",pu:"",dr:"",pc:null,dc:null,km:0,min:0,busy:false,msg:"",note:"",usePos:false};
function goAttr(x){var g=x.indexOf("Food")>-1?"food":x.indexOf("Bike")>-1?"bike":x.indexOf("Rides")>-1?"car":x.indexOf("Auto")>-1?"auto":x.indexOf("EV")>-1?"ev":"";return g?'data-go="'+g+'"':'data-soon="1"'}
function vget(k){return VEH.filter(function(v){return v.k==k})[0]}
function vehCards(){return GRP[ride.grp||"car"].map(function(k){var v=vget(k),far=v.mx&&ride.km>v.mx;return '<button type="button" class="card'+(ride.sel==k?' sel':'')+'" data-veh="'+k+'"><span class="ph">'+v.i+'</span><span class="nm">'+v.n+'</span><span class="fare">'+(ride.km>0&&!ride.busy?(far?t("toofar"):'\u20B9'+fareOf(v)):'')+'</span></button>'}).join("")}
function fareOf(v){var f=CITY[ride.city].f||1;return Math.max(Math.round(v.m*f),Math.ceil((v.b+v.p*ride.km)*f/5)*5)}
function wc(q){q=q.replace(/y?emmiganuru?/ig,"Yemmiganur");return q.toLowerCase().indexOf(CITY[ride.city].n.toLowerCase())>-1?q:q+", "+CITY[ride.city].n}
function geo(q,cb){fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(d){cb(d&&d[0]?{lat:+d[0].lat,lng:+d[0].lon}:null)}).catch(function(){cb(null)})}
function calc(){
 ride.msg="";ride.note="";ride.km=0;ride.busy=true;render();
 function fail(){ride.busy=false;ride.msg=t("notfound");render()}
 function done(km,min){ride.km=Math.max(km,0.1);ride.min=min;ride.busy=false;render()}
 function route(){
  var a=ride.pc,b=ride.dc,fb=function(){var k=dist(a.lat,a.lng,b.lat,b.lng)*1.3;done(k,Math.round(k*3))};
  fetch("https://router.project-osrm.org/route/v1/driving/"+a.lng+","+a.lat+";"+b.lng+","+b.lat+"?overview=false").then(function(r){return r.json()}).then(function(d){var r0=d.routes&&d.routes[0];if(r0)done(r0.distance/1000,Math.round(r0.duration/60));else fb()}).catch(fb)}
 function second(){geo(wc(ride.dr),function(c){if(!c){fail();return}ride.dc=c;route()})}
 if(ride.usePos&&ride.pc&&ride.pu==t("live"))second();
 else geo(wc(ride.pu),function(c){if(!c){fail();return}ride.pc=c;ride.usePos=false;second()})}
function rcall(m,p,b,cb){fetch(RIDE_API+p,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})}
var rtimer=null;
function poll(){clearInterval(rtimer);rtimer=setInterval(function(){if(!ride.id)return;rcall("GET","/rides/"+ride.id,null,function(r){if(r&&r.status){ride.st=r.status;ride.cap=r.captain;render();if(r.status=="completed"||r.status=="cancelled")clearInterval(rtimer)}})},4000)}
var unsubR=null;
function watchRide(){if(unsubR)unsubR();unsubR=fdb.collection("rides").doc(ride.id).onSnapshot(function(d){var r=d.data();if(r){ride.st=r.status;ride.cap=r.captain;render()}})}
function requestFB(){
 var vv=VEH.filter(function(x){return x.k==ride.sel})[0];
 if(vv.mx&&ride.km>vv.mx){ride.note=t("toofar");render();return}
 ride.fare=fareOf(vv);var ref=fdb.collection("rides").doc();
 ref.set({uid:uid,phone:phone,veh:vv.n,pu:ride.pu,dr:ride.dr,pc:ride.pc,dc:ride.dc,km:+ride.km.toFixed(2),fare:ride.fare,city:ride.city,status:"requested",captain:"",captainUid:"",createdMs:Date.now()}).then(function(){ride.id=ref.id;ride.st="requested";ride.cap="";ride.note="";watchRide();render()}).catch(function(){ride.note=t("rfail");render()})}
function statusView(){
 var st=ride.st,m={requested:t("finding"),accepted:t("accd")+(ride.cap?": +91 "+esc(ride.cap):""),completed:t("done"),cancelled:t("canc")}[st]||"";
 var h='<h2>\uD83D\uDE95 '+t("ride")+'</h2><div class="card"><span><span class="nm">'+esc(ride.pu)+' \u2192 '+esc(ride.dr)+'</span><br><span class="mute">'+ride.km.toFixed(1)+' km \u00B7 '+t("fare")+' \u20B9'+ride.fare+'</span></span></div><p role="status"><b>'+m+'</b></p>';
 if(st=="requested"||st=="accepted")h+='<button class="ghost" id="rcn">'+t("cancel")+'</button>';
 else h+='<button class="big" id="rnw">'+t("newride")+'</button>';
 return h}
function rideView(){
 if(ride.id)return statusView();
 var h='<button class="ghost" id="rb">\u2190 '+t("back")+'</button><h2>\uD83D\uDE95 '+t("ride")+'</h2>';
 h+=vehCards();
 h+='<select id="rc" aria-label="City" style="margin-bottom:8px">'+Object.keys(CITY).map(function(k){return '<option value="'+k+'"'+(k==ride.city?" selected":"")+'>'+CITY[k].n+'</option>'}).join("")+'</select>';
 h+='<input id="ru" placeholder="'+t("pickup")+'" aria-label="'+t("pickup")+'" value="'+esc(ride.pu)+'"><button class="ghost" id="rl" style="margin:6px 0;width:100%">\uD83D\uDCCD '+t("live")+'</button>';
 h+='<input id="rd" placeholder="'+t("drop")+'" aria-label="'+t("drop")+'" value="'+esc(ride.dr)+'"><button class="big" id="rg" style="margin-top:8px">'+t("getfare")+'</button>';
 if(ride.busy)h+='<p class="mute" role="status">'+t("wait")+'</p>';
 if(ride.msg)h+='<p class="low" role="alert">'+ride.msg+'</p>';
 if(ride.km>0&&!ride.busy){
  h+='<p><b>'+t("dist")+':</b> '+ride.km.toFixed(1)+' km \u00B7 ~'+ride.min+' min</p>';
  h+='<iframe title="Route" loading="lazy" src="https://maps.google.com/maps?saddr='+encodeURIComponent(ride.pc.lat+","+ride.pc.lng)+'&daddr='+encodeURIComponent(ride.dc.lat+","+ride.dc.lng)+'&output=embed"></iframe>';
  h+='<button class="big" id="rq">'+t("req")+'</button>';
  if(ride.note)h+='<p class="mute" role="status">'+ride.note+'</p>';
  h+='<p class="mute">'+t("fnote")+'</p>';
 }
 return h}
function render(){
 document.documentElement.lang=lang;$("lg").value=lang;$("sb").textContent=R.sub;
 var h="";
 if(!phone){
  h+='<h2>'+t("login")+'</h2>';
  if(!pending)h+='<form id="lf"><input name="ph" type="tel" inputmode="numeric" maxlength="14" placeholder="'+t("mobile")+'" aria-label="'+t("mobile")+'" required>'+(API?'<select name="ch" aria-label="OTP"><option value="sms">SMS</option><option value="whatsapp">WhatsApp</option></select>':'')+'<button>'+(API||fbWant?t("sendotp"):t("login"))+'</button></form>';
  else h+='<form id="of"><p>+91 '+pending+'</p><input name="o" inputmode="numeric" maxlength="6" placeholder="'+t("otp")+'" aria-label="'+t("otp")+'" required><button>'+t("verify")+'</button></form>'+(API||fbWant?'':'<p class="mute">'+t("demo")+' <b>'+otpCode+'</b></p>');
  if(err)h+='<p class="low" role="alert">'+err+'</p>';
 }else{
  if(screen=="food"){$("v").innerHTML=foodView();return}
  if(screen=="ride"){$("v").innerHTML=rideView();return}
  h+='<h2>'+t("hello")+', +91 '+phone+'</h2>';
  if(ROLE=="captain")h+='<button class="big" id="tg">'+(online?t("goff"):t("goon"))+'</button>';
  h+='<div class="grid">'+R.tiles.map(function(x){return '<button class="tile" '+goAttr(x)+'>'+x+'</button>'}).join("")+'</div>';
  if(note)h+='<p class="mute" role="status">'+note+'</p>';
  h+='<br><button class="ghost" id="out">'+t("logout")+'</button>';
 }
 $("v").innerHTML=h}
document.addEventListener("submit",function(e){
 e.preventDefault();var f=e.target,v=f.elements;
 if(f.id=="lf"){var ph=v.ph.value.replace(/\D/g,"").slice(-10);if(ph.length!=10){err=t("badph");render();return}err="";
  if(fbWant){if(!fbOn){err=t("fbfail");render();return}
  try{if(!verifier)verifier=new firebase.auth.RecaptchaVerifier("rcv",{size:"invisible"})}catch(x){}
  auth.signInWithPhoneNumber("+91"+ph,verifier).then(function(c){confirmation=c;pending=ph;render()}).catch(function(){err=t("sendfail");try{verifier.clear()}catch(x){}verifier=null;render()});return}
  if(!API){pending=ph;enter();render();return}
  call("/send-otp",{phone:ph,channel:v.ch.value},function(r){if(r&&r.sent)pending=ph;else err=t("sendfail");render()});return}
 if(f.id=="of"){var cd=v.o.value.trim();
  if(fbWant){confirmation.confirm(cd).catch(function(){err=t("badotp");render()});return}
  if(!API){if(cd==otpCode)enter();else err=t("badotp");render();return}
  call("/verify-otp",{phone:pending,code:cd},function(r){if(r&&r.approved)enter();else err=t("badotp");render()})}
});
document.addEventListener("click",function(e){var t0=e.target;
 if(t0.id=="out"){if(fbOn)auth.signOut();try{localStorage.removeItem(KEY+"_s")}catch(x){}phone="";pending=null;err="";note="";render()}
 if(t0.id=="tg"){online=!online;render()}
 var vc=t0.closest&&t0.closest("[data-veh]");if(vc){ride.sel=vc.dataset.veh;render();return}
 var gv=t0.dataset&&t0.dataset.go;
 if(gv=="food"){screen="food";if(PLACES_KEY&&!food.live)loadPlaces();render()}
 else if(gv){screen="ride";ride.grp=gv;ride.sel=GRP[gv][0];ride.km=0;ride.msg="";ride.note="";render()}
 if(t0.id=="rb"){screen="home";render()}
 if(t0.id=="rq"&&fbOn){requestFB()}
 if(t0.id=="rq"&&!fbOn){if(!RIDE_API){ride.note=t("noserver");render();return}
  var vv=VEH.filter(function(x){return x.k==ride.sel})[0];
  if(vv.mx&&ride.km>vv.mx){ride.note=t("toofar");render();return}
  ride.fare=fareOf(vv);
  rcall("POST","/rides",{phone:phone,veh:vv.n,pu:ride.pu,dr:ride.dr,pc:ride.pc,dc:ride.dc,km:+ride.km.toFixed(2),fare:ride.fare,city:ride.city},function(r){if(r&&r.id){ride.id=r.id;ride.st="requested";ride.cap="";ride.note="";poll();render()}else{ride.note=t("rfail");render()}})}
 if(t0.id=="rcn"&&fbOn){fdb.collection("rides").doc(ride.id).update({status:"cancelled"})}
 if(t0.id=="rcn"&&!fbOn){rcall("POST","/rides/"+ride.id+"/cancel",{phone:phone},function(r){if(r&&r.status){ride.st=r.status;render()}})}
 if(t0.id=="rnw"){ride.id="";ride.st="";ride.km=0;ride.note="";render()}
 if(t0.id=="rg"){ride.pu=$("ru").value.trim();ride.dr=$("rd").value.trim();if(ride.pu&&ride.dr)calc()}
 if(t0.id=="rl"){ride.dr=$("rd").value.trim();if(!navigator.geolocation){ride.msg=t("locfail");render();return}
  navigator.geolocation.getCurrentPosition(function(g){ride.pc={lat:g.coords.latitude,lng:g.coords.longitude};ride.usePos=true;ride.pu=t("live");ride.msg="";render()},function(){ride.msg=t("locfail");render()},{enableHighAccuracy:true,timeout:10000})}
 if(t0.id=="fb"){screen="home";render()}
 if(t0.id=="fm"){loadPlaces(true)}
 if(t0.id=="fl"){if(!navigator.geolocation){food.msg=t("locfail");render();return}
  navigator.geolocation.getCurrentPosition(function(g){food.pos={lat:g.coords.latitude,lng:g.coords.longitude};food.msg="";loadPlaces();render()},function(){food.msg=t("locfail");render()},{enableHighAccuracy:true,timeout:10000})}
 if(t0.dataset&&t0.dataset.soon){note=t("soon");render()}
});
document.addEventListener("change",function(e){var q0=e.target.id;
 if(q0=="rc"){ride.pu=$("ru").value.trim();ride.dr=$("rd").value.trim();ride.city=e.target.value;ride.km=0;ride.usePos=false;ride.msg="";render()}
 if(q0=="fc"){food.city=e.target.value;food.pos=null;food.live=false;food.list=[];food.tok="";loadPlaces();render()}
 if(q0=="fq"){food.q=e.target.value.trim();if(PLACES_KEY){food.live=false;loadPlaces()}render()}
 if(e.target.id=="lg"){lang=e.target.value;try{localStorage.setItem("aisameer_lang",lang)}catch(x){}render()}});
/* Firebase sign-in (phone OTP) */
if(fbWant){phone="";try{firebase.initializeApp(FB);auth=firebase.auth();if(firebase.firestore)fdb=firebase.firestore();fbOn=true}catch(e){}}
if(fbOn)auth.onAuthStateChanged(function(u){if(u&&u.phoneNumber){phone=u.phoneNumber.replace("+91","");uid=u.uid;pending=null;err=""}else{phone="";uid=""};render()});
/* fallback: some preview apps block form submission; run the form handler ourselves */
var subF=null;
function arm(f){subF=f;setTimeout(function(){var g=subF;subF=null;if(g&&g.checkValidity())g.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))},80)}
document.addEventListener("submit",function(){subF=null},true);
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(b&&b.form&&b.type=="submit")arm(b.form)});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&e.target.tagName=="INPUT"&&e.target.form)arm(e.target.form)});
render();
</script>
</body>
</html>
